<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Pipeline: dataset and model feed four tiers V, E, C, R; C hands extracted parameters to R; tiers merge into compare.json, which feeds figures, the database, the results tables and an LLM card that is verified before it becomes the commentary.">
  <title>DLNN pipeline block diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="start">

    <!-- column headings -->
    <text x="20" y="22" font-weight="bold" fill="#5a6270">INPUTS</text>
    <text x="290" y="22" font-weight="bold" fill="#5a6270">FOUR TIERS (same trained weights)</text>
    <text x="580" y="22" font-weight="bold" fill="#5a6270">MERGE</text>
    <text x="790" y="22" font-weight="bold" fill="#5a6270">CONSUMERS</text>

    <!-- inputs -->
    <rect x="20" y="40" width="170" height="64" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="30" y="60" font-weight="bold">dataset</text>
    <text x="30" y="77">dlnn/data/modrec.py</text>
    <text x="30" y="93">seeded, sha256 recorded</text>
    <rect x="20" y="130" width="170" height="78" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="30" y="150" font-weight="bold">model.npz</text>
    <text x="30" y="167">dlnn-model/1: int8 taps</text>
    <text x="30" y="183">in {-1,0,+1}, vsat, bias</text>
    <text x="30" y="199">torch QAT, offline</text>

    <!-- bus -->
    <line x1="190" y1="72" x2="232" y2="72" stroke="#3b4252" stroke-width="1.5"/>
    <line x1="190" y1="169" x2="232" y2="169" stroke="#3b4252" stroke-width="1.5"/>
    <line x1="232" y1="72" x2="232" y2="372" stroke="#3b4252" stroke-width="1.5"/>
    <line x1="232" y1="70" x2="288" y2="70" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="232" y1="160" x2="288" y2="160" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="232" y1="250" x2="288" y2="250" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="232" y1="372" x2="288" y2="372" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- tiers -->
    <rect x="290" y="40" width="230" height="64" rx="6" fill="#e8f0fb" stroke="#3b4252"/>
    <text x="300" y="60" font-weight="bold">V  virtual</text>
    <text x="300" y="77">numpy float32: ideal delays,</text>
    <text x="300" y="93">exact sums, exact tanh</text>

    <rect x="290" y="130" width="230" height="64" rx="6" fill="#fdf0e0" stroke="#3b4252"/>
    <text x="300" y="150" font-weight="bold">E  emulated</text>
    <text x="300" y="167">numpy fixed point (4000 ex.)</text>
    <text x="300" y="183">+ iverilog RTL on a subset</text>

    <rect x="290" y="220" width="230" height="64" rx="6" fill="#e3f5f3" stroke="#3b4252"/>
    <text x="300" y="240" font-weight="bold">C  circuit</text>
    <text x="300" y="257">ngspice unit cell: .ac .dc .tran</text>
    <text x="300" y="273">+ calibrated model (full set)</text>

    <rect x="290" y="340" width="230" height="64" rx="6" fill="#fbf5d9" stroke="#3b4252"/>
    <text x="300" y="360" font-weight="bold">R  RF</text>
    <text x="300" y="377">scikit-rf lines, couplers, noise,</text>
    <text x="300" y="393">numpy convolution (4000 ex.)</text>

    <!-- cascade C -> R -->
    <line x1="405" y1="284" x2="405" y2="338" stroke="#b4232a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrc)"/>
    <text x="415" y="306" fill="#b4232a" font-weight="bold">--cascade</text>
    <text x="415" y="322" fill="#b4232a">params/circuit_extracted.json</text>
    <text x="415" y="336" fill="#b4232a" font-size="11">(loss, V_sat, gain; C runs first)</text>

    <!-- tiers -> compare -->
    <polyline points="520,72 550,72 550,218 566,218" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <polyline points="520,162 540,162 540,232 566,232" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <polyline points="520,252 566,252" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <polyline points="520,372 550,372 550,266 566,266" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="455" y="440" fill="#5a6270">each tier writes tiers/X.json + X.npz</text>
    <text x="455" y="456" fill="#5a6270">(contract dlnn-tier/1, validated on save)</text>

    <rect x="568" y="190" width="170" height="104" rx="6" fill="#eef0f4" stroke="#3b4252" stroke-width="2"/>
    <text x="578" y="212" font-weight="bold">compare.json</text>
    <text x="578" y="229">metrics, deltas vs V,</text>
    <text x="578" y="245">sweeps, knees, timing,</text>
    <text x="578" y="261">fidelity.models / omits,</text>
    <text x="578" y="277">float32 reference block</text>

    <!-- consumers -->
    <rect x="790" y="40" width="190" height="52" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="800" y="60" font-weight="bold">figures 1-8</text>
    <text x="800" y="77">dlnn/viz, PNG+SVG, 2 themes</text>
    <rect x="790" y="104" width="190" height="52" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="800" y="124" font-weight="bold">SQLite (default)</text>
    <text x="800" y="141">or PostgreSQL, same DDL</text>
    <rect x="790" y="168" width="190" height="52" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="800" y="188" font-weight="bold">docs/results.md</text>
    <text x="800" y="205">scripts/make_results_md.py</text>
    <rect x="790" y="232" width="190" height="52" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="800" y="252" font-weight="bold">notebooks 00-06</text>
    <text x="800" y="269">reads run + small live runs</text>

    <polyline points="738,242 764,242 764,66 788,66" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <polyline points="738,242 758,242 758,130 788,130" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <polyline points="738,242 752,242 752,194 788,194" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <polyline points="738,258 788,258" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- LLM branch -->
    <polyline points="653,294 653,340 790,340" fill="none" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="665" y="332" fill="#5a6270">card.py renders</text>
    <rect x="790" y="312" width="190" height="52" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="800" y="332" font-weight="bold">llm/card.txt</text>
    <text x="800" y="349">text card from compare.json</text>

    <line x1="885" y1="364" x2="885" y2="388" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="790" y="390" width="190" height="52" rx="6" fill="#f3f5f9" stroke="#3b4252"/>
    <text x="800" y="410" font-weight="bold">Qwen2.5-1.5B Q4_K_M</text>
    <text x="800" y="427">llama.cpp, JSON grammar</text>

    <line x1="885" y1="442" x2="885" y2="466" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="790" y="468" width="190" height="40" rx="6" fill="#fdecec" stroke="#b4232a" stroke-width="1.5"/>
    <text x="800" y="485" font-weight="bold">verify.py, one retry</text>
    <text x="800" y="500">commentary.json (flagged)</text>
    <text x="640" y="492" fill="#5a6270">numbers checked against the card;</text>
    <text x="640" y="507" fill="#5a6270">failures flagged, never hidden</text>
  </g>
</svg>
