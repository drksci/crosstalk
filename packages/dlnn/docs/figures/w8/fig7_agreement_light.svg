  <g id="text_32">
   <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="12.168" y="15.858516" transform="rotate(-0 12.168 15.858516)">Prediction agreement between tiers (4000 test examples)</text>
  </g>
  <g id="text_33">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(8.64 328.50675)">E reproduces V almost exactly (0.996): 8-bit fixed point is nearly free. C and R agree with V on</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(8.64 338.22675)">only 0.60 and 0.50 of the examples because, in this run, both sit at 32 dB/us without repeaters</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(8.64 347.94675)">(not buildable) and C's default per-layer gain trim over-drives layer 3; they agree with each</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(8.64 357.66675)">other 0.62, more than with V, since the same operating point hurts both.</text>
  </g>
